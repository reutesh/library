<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>מנהל ספרייה</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="login-screen">
    <form id="login-form" class="login-card">
      <h1>📚 מנהל ספרייה</h1>
      <p class="login-subtitle">התחברות למערכת</p>
      <div class="form-group">
        <label for="login-username">שם משתמש</label>
        <input type="text" id="login-username" required autocomplete="username">
      </div>
      <div class="form-group">
        <label for="login-password">סיסמה</label>
        <input type="password" id="login-password" required autocomplete="current-password">
      </div>
      <div id="login-error" class="login-error" style="display:none"></div>
      <button type="submit" class="btn btn-primary btn-block">התחברות</button>
    </form>
  </div>

  <div id="app">
    <header>
      <div class="header-row">
        <h1>📚 מנהל ספרייה</h1>
        <div class="user-box" id="user-box" style="display:none">
          <span id="user-name"></span>
          <span class="role-badge" id="user-role-badge"></span>
          <button class="btn btn-secondary btn-small" id="btn-profile">שינוי סיסמה</button>
          <button class="btn btn-secondary btn-small" id="btn-logout">התנתקות</button>
        </div>
      </div>
      <nav>
        <button class="nav-btn" data-view="dashboard" id="nav-dashboard" style="display:none">לוח בקרה</button>
        <button class="nav-btn active" data-view="books">ספרים</button>
        <button class="nav-btn" data-view="rooms">חדרים ומדפים</button>
        <button class="nav-btn" data-view="users" id="nav-users" style="display:none">ניהול משתמשים</button>
      </nav>
    </header>

    <main>
      <section id="view-dashboard" class="view">
        <h2>לוח בקרה</h2>
        <div id="stats" class="stats-grid"></div>
        <h3>ספרים לא מוקצים</h3>
        <div id="unassigned-books" class="book-grid"></div>
      </section>

      <section id="view-books" class="view active">
        <div class="view-header" id="books-view-header">
          <h2>הספרים שלי</h2>
          <div class="actions">
            <input type="text" id="book-search" placeholder="חיפוש ספרים...">
            <button class="btn btn-primary" id="btn-add-book">+ הוסף ספר</button>
          </div>
        </div>
        <div class="filter-bar">
          <select id="filter-genre"><option value="">כל הז'אנרים</option></select>
          <select id="filter-room"><option value="">כל החדרים</option></select>
          <select id="filter-shelf"><option value="">כל המדפים</option></select>
          <select id="filter-author"><option value="">כל המחברים</option></select>
          <button class="btn btn-secondary btn-small" data-action="clear-filters">נקה סינון</button>
        </div>
        <div id="books-list" class="book-grid"></div>
        <div id="pagination-bar"></div>
      </section>

      <section id="view-rooms" class="view">
        <div class="view-header">
          <h2>חדרים ומדפים</h2>
          <button class="btn btn-primary" id="btn-add-room">+ הוסף חדר</button>
        </div>
        <div id="rooms-list" class="rooms-container"></div>
      </section>

      <section id="view-users" class="view">
        <div class="view-header">
          <h2>ניהול משתמשים</h2>
          <button class="btn btn-primary" id="btn-add-user">+ הוסף משתמש</button>
        </div>
        <div id="users-list"></div>
      </section>
    </main>

    <!-- Book Modal -->
    <div id="book-modal" class="modal">
      <div class="modal-content">
        <div class="modal-header">
          <h3 id="book-modal-title">הוסף ספר</h3>
          <button class="modal-close" id="btn-close-book-modal">&times;</button>
        </div>
        <form id="book-form">
          <input type="hidden" id="book-id">
          <div class="form-group">
            <label for="book-title">כותרת *</label>
            <input type="text" id="book-title" required>
          </div>
          <div class="form-group">
            <label for="book-author">מחבר/ת</label>
            <input type="text" id="book-author">
          </div>
          <div class="form-row">
            <div class="form-group">
              <label for="book-isbn">ISBN</label>
              <input type="text" id="book-isbn">
            </div>
            <div class="form-group autocomplete-wrapper">
              <label for="book-genre">ז'אנר</label>
              <input type="text" id="book-genre" autocomplete="off">
              <ul id="genre-suggestions" class="suggestions-list"></ul>
            </div>
          </div>
          <div class="form-group">
            <label for="book-shelf">מיקום</label>
            <select id="book-shelf">
              <option value="">לא מוקצה</option>
            </select>
          </div>
          <div class="form-group">
            <label for="book-notes">הערות</label>
            <textarea id="book-notes" rows="3"></textarea>
          </div>
          <div class="form-actions">
            <button type="button" class="btn btn-secondary" id="btn-cancel-book">ביטול</button>
            <button type="submit" class="btn btn-primary">שמירה</button>
          </div>
        </form>
      </div>
    </div>

    <!-- Room Modal -->
    <div id="room-modal" class="modal">
      <div class="modal-content">
        <div class="modal-header">
          <h3 id="room-modal-title">הוסף חדר</h3>
          <button class="modal-close" id="btn-close-room-modal">&times;</button>
        </div>
        <form id="room-form">
          <input type="hidden" id="room-id">
          <div class="form-group">
            <label for="room-name">שם החדר *</label>
            <input type="text" id="room-name" required>
          </div>
          <div class="form-actions">
            <button type="button" class="btn btn-secondary" id="btn-cancel-room">ביטול</button>
            <button type="submit" class="btn btn-primary">שמירה</button>
          </div>
        </form>
      </div>
    </div>

    <!-- Shelf Modal -->
    <div id="shelf-modal" class="modal">
      <div class="modal-content">
        <div class="modal-header">
          <h3 id="shelf-modal-title">הוסף מדף</h3>
          <button class="modal-close" id="btn-close-shelf-modal">&times;</button>
        </div>
        <form id="shelf-form">
          <input type="hidden" id="shelf-id">
          <input type="hidden" id="shelf-room-id">
          <div class="form-group">
            <label for="shelf-name">שם המדף *</label>
            <input type="text" id="shelf-name" required>
          </div>
          <div class="form-actions">
            <button type="button" class="btn btn-secondary" id="btn-cancel-shelf">ביטול</button>
            <button type="submit" class="btn btn-primary">שמירה</button>
          </div>
        </form>
      </div>
    </div>
    <!-- User Modal -->
    <div id="user-modal" class="modal">
      <div class="modal-content">
        <div class="modal-header">
          <h3 id="user-modal-title">הוסף משתמש</h3>
          <button class="modal-close" id="btn-close-user-modal">&times;</button>
        </div>
        <form id="user-form">
          <input type="hidden" id="user-id">
          <div class="form-group">
            <label for="user-username">שם משתמש *</label>
            <input type="text" id="user-username" required autocomplete="off">
          </div>
          <div class="form-group">
            <label for="user-password">סיסמה *</label>
            <input type="password" id="user-password" required minlength="6" autocomplete="new-password">
            <small class="field-hint" id="password-hint" style="display:none">השאר ריק כדי להשאיר את הסיסמה ללא שינוי</small>
          </div>
          <div class="form-group">
            <label for="user-role">תפקיד</label>
            <select id="user-role">
              <option value="viewer">צופה — צפייה בלבד</option>
              <option value="editor">עורך — עריכה בחדרים מסוימים</option>
              <option value="admin">מנהל — גישה להכל</option>
            </select>
          </div>
          <div class="form-group" id="user-rooms-group" style="display:none">
            <label>חדרים מותרים לעריכה</label>
            <div id="user-rooms" class="rooms-checkbox-grid"></div>
          </div>
          <div class="form-actions">
            <button type="button" class="btn btn-secondary" id="btn-cancel-user">ביטול</button>
            <button type="submit" class="btn btn-primary">שמירה</button>
          </div>
        </form>
      </div>
    </div>

    <!-- Profile Modal -->
    <div id="profile-modal" class="modal">
      <div class="modal-content">
        <div class="modal-header">
          <h3>שינוי סיסמה</h3>
          <button class="modal-close" id="btn-close-profile-modal">&times;</button>
        </div>
        <form id="profile-form">
          <div class="form-group">
            <label for="profile-current-password">סיסמה נוכחית *</label>
            <input type="password" id="profile-current-password" required autocomplete="current-password">
          </div>
          <div class="form-group">
            <label for="profile-new-password">סיסמה חדשה *</label>
            <input type="password" id="profile-new-password" required minlength="6" autocomplete="new-password">
          </div>
          <div class="form-group">
            <label for="profile-confirm-password">אישור סיסמה *</label>
            <input type="password" id="profile-confirm-password" required minlength="6" autocomplete="new-password">
          </div>
          <div id="profile-error" class="login-error" style="display:none"></div>
          <div class="form-actions">
            <button type="button" class="btn btn-secondary" id="btn-cancel-profile">ביטול</button>
            <button type="submit" class="btn btn-primary">שמירה</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
